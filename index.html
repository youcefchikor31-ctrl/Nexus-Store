<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Store - المتجر الرقمي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background-color: #0b0f19; color: #f3f4f6; overflow-x: hidden; }
        
        header {
            position: fixed; top: 0; left: 0; width: 100%;
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 5%; z-index: 100;
        }
        .logo { font-size: 1.5rem; font-weight: 700; color: #38bdf8; display: flex; align-items: center; gap: 10px; }
        
        .header-controls { display: flex; align-items: center; gap: 15px; }
        .lang-select {
            background: #1e293b; color: white; border: 1px solid #334155;
            padding: 8px 12px; border-radius: 20px; font-weight: 600; cursor: pointer; outline: none;
        }
        .cart-btn {
            background: linear-gradient(135deg, #6366f1, #a855f7); border: none;
            padding: 10px 20px; border-radius: 30px; color: white; font-weight: 600; cursor: pointer;
        }

        main { max-width: 1200px; margin: 120px auto 50px; padding: 0 20px; }
        .hero-section { text-align: center; margin-bottom: 50px; }
        .hero-section h2 { font-size: 2.5rem; margin-bottom: 10px; color: #fff; }
        .hero-section p { color: #94a3b8; font-size: 1.1rem; }

        /* مؤشر التحميل الدارئ (Spinner) */
        .loading-container {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            grid-column: 1 / -1; padding: 50px 0; gap: 15px;
        }
        .spinner {
            width: 50px; height: 50px; border: 5px solid rgba(56, 189, 248, 0.2);
            border-top-color: #38bdf8; border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .products-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; }
        .product-card {
            background: rgba(30, 41, 59, 0.6); border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px; overflow: hidden; transition: 0.3s ease; display: flex; flex-direction: column; justify-content: space-between;
        }
        .product-card:hover { transform: translateY(-8px); border-color: rgba(56, 189, 248, 0.4); }
        .product-img { width: 100%; height: 200px; object-fit: cover; background: #334155; }
        .product-info { padding: 20px; }
        .product-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 8px; color: #f8fafc; }
        .product-price { font-size: 1.3rem; font-weight: 900; color: #38bdf8; margin-bottom: 15px; }

        .card-actions { padding: 0 20px 20px; display: flex; flex-direction: column; gap: 12px; }
        .quantity-control { display: flex; justify-content: space-between; align-items: center; background: rgba(15, 23, 42, 0.5); border-radius: 10px; padding: 5px 10px; }
        .qty-btn { background: #334155; border: none; color: white; width: 30px; height: 30px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .qty-input { background: transparent; border: none; color: white; text-align: center; width: 40px; font-size: 1rem; font-weight: bold; }
        .buy-now-btn {
            background: linear-gradient(135deg, #0ea5e9, #2563eb); border: none; padding: 12px;
            border-radius: 12px; color: white; font-weight: 700; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px;
        }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(5px);
            display: flex; justify-content: center; align-items: center; z-index: 1000; opacity: 0; visibility: hidden; transition: 0.3s;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-content { background: #1e293b; border: 1px solid rgba(255, 255, 255, 0.1); width: 90%; max-width: 450px; padding: 30px; border-radius: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: #cbd5e1; font-size: 0.9rem; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 10px; color: white; }
        .form-group select { cursor: pointer; }
        .error-hint { color: #f43f5e; font-size: 0.75rem; margin-top: 4px; display: none; }
        .submit-order-btn { width: 100%; background: linear-gradient(135deg, #10b981, #059669); border: none; padding: 14px; border-radius: 12px; color: white; font-weight: 700; cursor: pointer; margin-top: 10px; }
        .submit-order-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        
        .success-msg { text-align: center; display: none; }
        .success-msg i { font-size: 4rem; margin-bottom: 15px; }
        .success-msg.success i { color: #10b981; }
        .success-msg.error i { color: #f43f5e; }
        .success-msg.loading i { color: #38bdf8; animation: spin 1s linear infinite; }
        
        .modal-close-btn { background: none; border: none; color: #94a3b8; font-size: 1.2rem; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <div class="logo"><i class="fa-solid fa-gem"></i> <span id="t-store-name">Nexus Store</span></div>
        <div class="header-controls">
            <select class="lang-select" id="langSwitcher" onchange="changeLanguage(this.value)">
                <option value="ar">العربية</option>
                <option value="fr">Français</option>
                <option value="en">English</option>
            </select>
            <button class="cart-btn"><i class="fa-solid fa-cart-shopping"></i> <span id="t-cart">السلة</span> (<span id="cart-count">0</span>)</button>
        </div>
    </header>

    <main>
        <div class="hero-section">
            <h2 id="t-hero-title">اكتشف أحدث المنتجات والعروض</h2>
            <p id="t-hero-desc">المنتجات المعروضة أدناه يتم جلبها مباشرة من قاعدة البيانات!</p>
        </div>

        <div class="products-grid" id="dynamic-products-container">
            <!-- عنصر التحميل التلقائي -->
            <div class="loading-container" id="loadingSpinner">
                <div class="spinner"></div>
                <p id="t-loading" style="color: #94a3b8;">جاري تحميل المنتجات، يرجى الانتظار...</p>
            </div>
        </div>
    </main>

    <!-- نموذج الطلب -->
    <div class="modal-overlay" id="orderModal">
        <div class="modal-content">
            <div id="order-form-container">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h3 id="t-modal-title" style="color: #fff;">تأكيد الطلب</h3>
                    <button type="button" onclick="closeModal()" class="modal-close-btn"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <form id="checkoutForm" onsubmit="submitOrderToTelegram(event)">
                    <div class="form-group">
                        <label id="t-name-label">الاسم واللقب:</label>
                        <input type="text" id="client-name" placeholder="أدخل اسمك الكامل..." required minlength="4">
                    </div>
                    <div class="form-group">
                        <label id="t-phone-label">رقم الهاتف:</label>
                        <input type="tel" id="client-phone" placeholder="05 / 06 / 07..." required>
                        <div class="error-hint" id="phone-error">رقم الهاتف يجب أن يكون 10 أرقام تبدأ بـ 05 أو 06 أو 07</div>
                    </div>
                    <div class="form-group">
                        <label id="t-wilaya-label">الولاية:</label>
                        <select id="client-wilaya" required onchange="updateCircles()">
                            <option value="">-- اختر الولاية --</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label id="t-daira-label">الدائرة / البلدية:</label>
                        <select id="client-daira" required>
                            <option value="">-- اختر الدائرة أولاً --</option>
                        </select>
                    </div>
                    <button type="submit" class="submit-order-btn" id="t-submit-btn">إرسال الطلب نهائياً</button>
                </form>
            </div>

            <div class="success-msg" id="successMsg">
                <i class="fa-solid fa-spinner"></i>
                <h3 id="t-success-title" style="color:#fff;">جاري معالجة طلبك...</h3>
                <p id="t-success-desc" style="color: #94a3b8; margin-bottom: 20px;">يرجى الانتظار...</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDb-obRwObo0xOTZAdSWgHZ4p9YQlQq95M",
            authDomain: "nexus-store-f481d.firebaseapp.com",
            projectId: "nexus-store-f481d",
            storageBucket: "nexus-store-f481d.firebasestorage.app",
            messagingSenderId: "573315219880",
            appId: "1:573315219880:web:ae5a4ef4e77789a2d81d9d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let selectedProduct = { name: '', price: 0, qty: 1 };
        let productsData = [];

        // قاعمة الولايات والدوائر الجزائرية
        const algerianWilayas = {
            "أدرار": ["أدرار", "أراقلة", "أولف", "تيمياوين"],
            "الشلف": ["الشلف", "بومرداس", "دراق", "سيدي علي بوسيدي"],
            "الجزائر": ["الجزائر الوسطى", "بن عكنون", "بوزريعة", "الشراقة", "درارية"],
            "تيارت": ["تيارت", "آفلو", "ثنية الحد", "سيدي بوعلام"],
            "تلمسان": ["تلمسان", "مغنية", "بني منصور", "سبدو"],
            "الجلفة": ["الجلفة", "برج بونعامة", "بريان", "القاسم"],
            "جيجل": ["جيجل", "الأنسام", "بونوار، الميلية"],
            "سطيف": ["سطيف", "أولاد جديع", "بني عزيز", "عين الدفلى"],
            "سعيدة": ["سعيدة", "أولاد خليفة", "موسى لاي"],
            "سكيكدة": ["سكيكدة", "الحرّاش، علي منجلي"],
            "سيدي بلعباس": ["سيدي بلعباس", "الحمادية", "سيدي خطاب"],
            "عنابة": ["عنابة", "البطارية، سيدي عمّار"],
            "قالمة": ["قالمة", "براقي، تاجروت"],
            "قسنطينة": ["قسنطينة", "الحارة، حامة الباغ"],
            "المدية": ["المدية", "أولاد يحيى، خمسة"],
            "مستغانم": ["مستغانم", "الشرارقة، سطاوالي"],
            "معسكر": ["معسكر", "زاكار، بني ستوت"],
            "الوادي": ["الوادي", "غردايا، تقرت"],
            "ورقلة": ["ورقلة", "تقرت، البليدة"],
            "وهران": ["وهران", "السنية الجديدة"],
            "الأغواط": ["الأغواط", "القصور"],
            "البليدة": ["البليدة", "الشرّيعة، شيشة"],
            "البيض": ["البيض", "عين بن ناحية"],
            "بسكرة": ["بسكرة", "أولاد جلال", "سيدي خالد"],
            "بشار": ["بشار", "قصدار"],
            "بويرة": ["بويرة", "أولاد أحمد"],
            "تبسة": ["تبسة", "الونزة، عينيه"],
            "تسمسيلت": ["تسمسيلت", "لعطاء"],
            "خنشلة": ["خنشلة", "عين الترك"],
            "عين الدفلى": ["عين الدفلى", "بئر الخاشة"],
            "عين تيموشنت": ["عين تيموشنت", "سيدي بن عديس"],
            "غليزان": ["غليزان", "مصفصة"],
            "غردايا": ["غردايا", "بنورة", "الهنيات"],
            "إليزي": ["إليزي", "تمنراست"],
            "جانت": ["جانت"],
            "لسان": ["ليسان"],
            "النعامة": ["النعامة", "عين صفرة"],
            "منيعة": ["منيعة"],
            "تمنراست": ["تمنراست", "إن قزّام"],
            "تيندوف": ["تيندوف", "بوجدور"],
            "تيسيمسيلت": ["تيسيمسيلت", "لحجار"]
        };

        // قاموس اللغات
        const translations = {
            ar: {
                storeName: "Nexus Store",
                cart: "السلة",
                heroTitle: "اكتشف أحدث المنتجات والعروض",
                heroDesc: "المنتجات المعروضة أدناه يتم جلبها مباشرة من قاعدة البيانات!",
                loading: "جاري تحميل المنتجات، يرجى الانتظار...",
                noProducts: "لا توجد منتجات حالياً، يرجى إضافتها عبر لوحة التحكم.",
                buyBtn: "اطلب الآن",
                modalTitle: "تأكيد الطلب",
                prodLabel: "المنتج المطلوب:",
                qtyLabel: "الكمية:",
                nameLabel: "الاسم واللقب:",
                phoneLabel: "رقم الهاتف:",
                wilayaLabel: "الولاية:",
                dairaLabel: "الدائرة / البلدية:",
                submitBtn: "إرسال الطلب نهائياً",
                processingTitle: "جاري معالجة طلبك...",
                processingDesc: "يرجى الانتظار...",
                successTitle: "تم إرسال طلبك بنجاح! ✓",
                successDesc: "سنتواصل معك قريباً لتأكيد التوصيل.",
                errorTitle: "حدث خطأ! ✗",
                errorDesc: "يرجى المحاولة مرة أخرى.",
                errorPhone: "رقم الهاتف يجب أن يكون 10 أرقام تبدأ بـ 05 أو 06 أو 07"
            },
            fr: {
                storeName: "Nexus Store",
                cart: "Panier",
                heroTitle: "Découvrez les derniers produits",
                heroDesc: "Les produits ci-dessous sont chargés directement depuis la base de données !",
                loading: "Chargement des produits en cours, veuillez patienter...",
                noProducts: "Aucun produit disponible pour le moment.",
                buyBtn: "Commander",
                modalTitle: "Confirmation de commande",
                prodLabel: "Produit souhaité:",
                qtyLabel: "Quantité:",
                nameLabel: "Nom et Prénom:",
                phoneLabel: "Numéro de téléphone:",
                wilayaLabel: "Wilaya:",
                dairaLabel: "Daïra/Commune:",
                submitBtn: "Envoyer la commande",
                processingTitle: "Traitement de votre commande...",
                processingDesc: "Veuillez patienter...",
                successTitle: "Commande envoyée avec succès ! ✓",
                successDesc: "Nous vous contacterons bientôt pour confirmer.",
                errorTitle: "Une erreur s'est produite ! ✗",
                errorDesc: "Veuillez réessayer.",
                errorPhone: "Le numéro doit comporter 10 chiffres (05, 06, 07)"
            },
            en: {
                storeName: "Nexus Store",
                cart: "Cart",
                heroTitle: "Discover Latest Products & Deals",
                heroDesc: "Products below are fetched directly from the database!",
                loading: "Loading products, please wait...",
                noProducts: "No products available at the moment.",
                buyBtn: "Buy Now",
                modalTitle: "Confirm Order",
                prodLabel: "Selected Product:",
                qtyLabel: "Quantity:",
                nameLabel: "Full Name:",
                phoneLabel: "Phone Number:",
                wilayaLabel: "State:",
                dairaLabel: "District/City:",
                submitBtn: "Submit Order",
                processingTitle: "Processing your order...",
                processingDesc: "Please wait...",
                successTitle: "Order Sent Successfully! ✓",
                successDesc: "We will contact you soon to confirm delivery.",
                errorTitle: "An Error Occurred! ✗",
                errorDesc: "Please try again.",
                errorPhone: "Phone number must be 10 digits starting with 05, 06, or 07"
            }
        };

        window.changeLanguage = function(lang) {
            const t = translations[lang];
            document.documentElement.lang = lang;
            document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';

            document.getElementById('t-store-name').innerText = t.storeName;
            document.getElementById('t-cart').innerText = t.cart;
            document.getElementById('t-hero-title').innerText = t.heroTitle;
            document.getElementById('t-hero-desc').innerText = t.heroDesc;
            document.getElementById('t-modal-title').innerText = t.modalTitle;
            document.getElementById('t-name-label').innerText = t.nameLabel;
            document.getElementById('t-phone-label').innerText = t.phoneLabel;
            document.getElementById('t-wilaya-label').innerText = t.wilayaLabel;
            document.getElementById('t-daira-label').innerText = t.dairaLabel;
            document.getElementById('t-submit-btn').innerText = t.submitBtn;
            document.getElementById('phone-error').innerText = t.errorPhone;

            const loadingText = document.getElementById('t-loading');
            if (loadingText) loadingText.innerText = t.loading;

            loadWilayas();
            renderProducts();
        }

        window.loadWilayas = function() {
            const wilayaSelect = document.getElementById('client-wilaya');
            wilayaSelect.innerHTML = '<option value="">-- اختر الولاية --</option>';
            
            Object.keys(algerianWilayas).forEach(wilaya => {
                const option = document.createElement('option');
                option.value = wilaya;
                option.textContent = wilaya;
                wilayaSelect.appendChild(option);
            });
        }

        window.updateCircles = function() {
            const wilayaSelect = document.getElementById('client-wilaya');
            const dairaSelect = document.getElementById('client-daira');
            const selectedWilaya = wilayaSelect.value;

            dairaSelect.innerHTML = '<option value="">-- اختر الدائرة --</option>';

            if (selectedWilaya && algerianWilayas[selectedWilaya]) {
                algerianWilayas[selectedWilaya].forEach(daira => {
                    const option = document.createElement('option');
                    option.value = daira;
                    option.textContent = daira;
                    dairaSelect.appendChild(option);
                });
            }
        }

        async function loadProducts() {
            try {
                const querySnapshot = await getDocs(collection(db, "products"));
                productsData = [];
                querySnapshot.forEach((doc) => {
                    productsData.push({ id: doc.id, ...doc.data() });
                });
                loadWilayas();
                renderProducts();
            } catch (error) {
                console.error("Error loading products:", error);
                const container = document.getElementById('dynamic-products-container');
                container.innerHTML = '<p style="text-align: center; color: #f43f5e; grid-column: 1/-1;">خطأ في الاتصال بقاعدة البيانات.</p>';
            }
        }

        function renderProducts() {
            const container = document.getElementById('dynamic-products-container');
            const currentLang = document.getElementById('langSwitcher').value;
            const t = translations[currentLang];

            if (productsData.length === 0) {
                container.innerHTML = `<p style="text-align: center; color: #94a3b8; grid-column: 1/-1;">${t.noProducts}</p>`;
                return;
            }

            container.innerHTML = '';
            productsData.forEach((p) => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <img src="${p.image}" alt="${p.name}" class="product-img" onerror="this.src='https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=500&q=80'">
                    <div class="product-info">
                        <div class="product-title">${p.name}</div>
                        <div class="product-price">${p.price} DZD</div>
                    </div>
                    <div class="card-actions">
                        <div class="quantity-control">
                            <button type="button" class="qty-btn" onclick="changeQty(this, -1)">-</button>
                            <input type="text" class="qty-input" value="1" readonly>
                            <button type="button" class="qty-btn" onclick="changeQty(this, 1)">+</button>
                        </div>
                        <button type="button" class="buy-now-btn" onclick='openOrderModal(${JSON.stringify(p.name)}, ${p.price}, this)'>
                            <i class="fa-solid fa-bag-shopping"></i> ${t.buyBtn}
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        window.addEventListener('DOMContentLoaded', loadProducts);

        window.changeQty = function(button, delta) {
            const input = button.closest('.product-card').querySelector('.qty-input');
            let val = parseInt(input.value) + delta;
            if (val < 1) val = 1;
            input.value = val;
        }

        window.openOrderModal = function(name, price, button) {
            const qty = parseInt(button.closest('.product-card').querySelector('.qty-input').value);
            selectedProduct = { name, price, qty };

            document.getElementById('order-form-container').style.display = 'block';
            document.getElementById('successMsg').style.display = 'none';
            document.getElementById('checkoutForm').reset();
            document.getElementById('client-wilaya').value = '';
            document.getElementById('client-daira').innerHTML = '<option value="">-- اختر الدائرة أولاً --</option>';
            document.getElementById('orderModal').classList.add('active');
        }

        window.closeModal = function() {
            document.getElementById('orderModal').classList.remove('active');
        }

        window.submitOrderToTelegram = function(event) {
            event.preventDefault();
            
            const name = document.getElementById('client-name').value.trim();
            const phone = document.getElementById('client-phone').value.trim();
            const wilaya = document.getElementById('client-wilaya').value;
            const daira = document.getElementById('client-daira').value;

            if (!/^(05|06|07)[0-9]{8}$/.test(phone)) {
                document.getElementById('phone-error').style.display = 'block';
                return;
            }
            document.getElementById('phone-error').style.display = 'none';

            // إخفاء النموذج وإظهار رسالة التحميل
            document.getElementById('order-form-container').style.display = 'none';
            const successMsg = document.getElementById('successMsg');
            successMsg.style.display = 'block';
            successMsg.className = 'success-msg loading';
            
            const currentLang = document.getElementById('langSwitcher').value;
            const t = translations[currentLang];
            
            document.getElementById('t-success-title').innerText = t.processingTitle;
            document.getElementById('t-success-desc').innerText = t.processingDesc;

            const message = `🚨 *طلب جديد من المتجر!*\n\n` +
                            `🛍️ *المنتج:* ${selectedProduct.name}\n` +
                            `🔢 *الكمية:* ${selectedProduct.qty}\n` +
                            `💰 *الإجمالي:* ${selectedProduct.price * selectedProduct.qty} DZD\n\n` +
                            `👤 *الاسم:* ${name}\n` +
                            `📞 *الهاتف:* ${phone}\n` +
                            `📍 *الولاية:* ${wilaya}\n` +
                            `📍 *الدائرة:* ${daira}`;

            fetch(`https://api.telegram.org/bot8701140722:AAFIl1umf8x-23P7LNJUoNDowwreo8yYWGo/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: "7737717483", text: message, parse_mode: 'Markdown' })
            }).then(res => {
                setTimeout(() => {
                    if (res.ok) {
                        // نجاح
                        successMsg.className = 'success-msg success';
                        document.getElementById('t-success-title').innerText = t.successTitle;
                        document.getElementById('t-success-desc').innerText = t.successDesc;
                        document.querySelector('#successMsg i').innerHTML = '<i class="fa-solid fa-circle-check"></i>';
                        
                        let count = parseInt(document.getElementById('cart-count').innerText);
                        document.getElementById('cart-count').innerText = count + selectedProduct.qty;
                        
                        // إضافة زر الإغلاق
                        const closeBtn = document.createElement('button');
                        closeBtn.type = 'button';
                        closeBtn.className = 'submit-order-btn';
                        closeBtn.style.marginTop = '20px';
                        closeBtn.textContent = 'حسناً';
                        closeBtn.onclick = closeModal;
                        
                        // إزالة أي أزرار سابقة
                        const oldBtn = document.querySelector('#successMsg .submit-order-btn');
                        if (oldBtn) oldBtn.remove();
                        document.getElementById('successMsg').appendChild(closeBtn);
                    } else {
                        // فشل
                        successMsg.className = 'success-msg error';
                        document.getElementById('t-success-title').innerText = t.errorTitle;
                        document.getElementById('t-success-desc').innerText = t.errorDesc;
                        document.querySelector('#successMsg i').innerHTML = '<i class="fa-solid fa-circle-xmark"></i>';
                        
                        // إضافة زر المحاولة مرة أخرى
                        const retryBtn = document.createElement('button');
                        retryBtn.type = 'button';
                        retryBtn.className = 'submit-order-btn';
                        retryBtn.style.marginTop = '20px';
                        retryBtn.textContent = 'محاولة أخرى';
                        retryBtn.onclick = () => {
                            document.getElementById('order-form-container').style.display = 'block';
                            document.getElementById('successMsg').style.display = 'none';
                        };
                        
                        // إزالة أي أزرار سابقة
                        const oldBtn = document.querySelector('#successMsg .submit-order-btn');
                        if (oldBtn) oldBtn.remove();
                        document.getElementById('successMsg').appendChild(retryBtn);
                    }
                }, 2000); // تأخير 2 ثانية لعرض حالة التحميل
            }).catch(err => {
                // خطأ في الاتصال
                console.error(err);
                setTimeout(() => {
                    successMsg.className = 'success-msg error';
                    document.getElementById('t-success-title').innerText = t.errorTitle;
                    document.getElementById('t-success-desc').innerText = "خطأ في الاتصال بالخادم";
                    document.querySelector('#successMsg i').innerHTML = '<i class="fa-solid fa-circle-xmark"></i>';
                    
                    const retryBtn = document.createElement('button');
                    retryBtn.type = 'button';
                    retryBtn.className = 'submit-order-btn';
                    retryBtn.style.marginTop = '20px';
                    retryBtn.textContent = 'محاولة أخرى';
                    retryBtn.onclick = () => {
                        document.getElementById('order-form-container').style.display = 'block';
                        document.getElementById('successMsg').style.display = 'none';
                    };
                    
                    const oldBtn = document.querySelector('#successMsg .submit-order-btn');
                    if (oldBtn) oldBtn.remove();
                    document.getElementById('successMsg').appendChild(retryBtn);
                }, 2000);
            });
        }
    </script>
</body>
</html>
