<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samir Store - المتجر الرقمي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background-color: #0b0f19; color: #f3f4f6; overflow-x: hidden; display: flex; flex-direction: column; min-height: 100vh; }
        
        header {
            position: fixed; top: 0; left: 0; width: 100%;
            background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 5%; z-index: 100;
        }
        .logo { font-size: 1.6rem; font-weight: 800; color: #38bdf8; display: flex; align-items: center; gap: 10px; letter-spacing: 0.5px; }
        
        .header-controls { display: flex; align-items: center; gap: 15px; }
        .lang-select {
            background: #1e293b; color: white; border: 1px solid #334155;
            padding: 8px 14px; border-radius: 20px; font-weight: 600; cursor: pointer; outline: none;
        }

        /* سلة عائمة على اليسار بتصميم دائري متحرك */
        .floating-cart-btn {
            position: fixed; bottom: 30px; left: 30px;
            width: 65px; height: 65px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border: none; border-radius: 50%;
            color: white; font-size: 1.4rem;
            cursor: pointer; z-index: 999;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.4);
            transition: transform 0.2s, background 0.2s;
        }
        .floating-cart-btn:hover { transform: scale(1.1); }

        /* تأثير الاهتزاز للسلة */
        @keyframes shakeCart {
            0% { transform: scale(1) rotate(0deg); }
            20% { transform: scale(1.2) rotate(-10deg); }
            40% { transform: scale(1.2) rotate(10deg); }
            60% { transform: scale(1.2) rotate(-10deg); }
            80% { transform: scale(1.1) rotate(5deg); }
            100% { transform: scale(1) rotate(0deg); }
        }
        .floating-cart-btn.shake {
            animation: shakeCart 0.5s ease-in-out;
            background: linear-gradient(135deg, #10b981, #059669);
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.6);
        }

        .cart-badge {
            position: absolute; top: 5px; right: 5px;
            background: #f43f5e; color: white; font-size: 0.75rem; font-weight: 800;
            width: 22px; height: 22px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            border: 2px solid #0b0f19;
        }

        main { max-width: 1200px; margin: 120px auto 60px; padding: 0 20px; flex: 1; width: 100%; }
        .hero-section { text-align: center; margin-bottom: 40px; }
        .hero-section h2 { font-size: 2.4rem; margin-bottom: 8px; color: #fff; font-weight: 800; }
        .hero-section p { color: #94a3b8; font-size: 1.05rem; }

        .loading-container {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            grid-column: 1 / -1; padding: 60px 0; gap: 15px;
        }
        .spinner {
            width: 45px; height: 45px; border: 4px solid rgba(56, 189, 248, 0.2);
            border-top-color: #38bdf8; border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .products-grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 25px; 
        }
        @media (max-width: 900px) {
            .products-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 600px) {
            .products-grid { grid-template-columns: 1fr; }
        }

        .product-card {
            background: rgba(30, 41, 59, 0.5); border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px; overflow: hidden; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; flex-direction: column; justify-content: space-between;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }
        .product-card:hover { 
            transform: translateY(-6px); 
            border-color: rgba(56, 189, 248, 0.3);
            box-shadow: 0 10px 30px rgba(56, 189, 248, 0.1);
        }
        
        .product-img-wrapper {
            position: relative;
            width: 100%;
            height: 210px;
            overflow: hidden;
            background: #1e293b;
        }
        .product-img { 
            width: 100%; height: 100%; object-fit: cover; 
            transition: transform 0.5s ease;
        }
        .product-card:hover .product-img { transform: scale(1.05); }

        .product-info { padding: 18px 20px 10px; }
        .product-title { font-size: 1.15rem; font-weight: 700; margin-bottom: 8px; color: #f8fafc; line-height: 1.4; }
        .product-price { font-size: 1.25rem; font-weight: 900; color: #38bdf8; }

        .card-actions { padding: 12px 20px 20px; display: flex; flex-direction: column; gap: 12px; }
        
        .card-bottom-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .quantity-control { 
            display: flex; align-items: center; 
            background: rgba(15, 23, 42, 0.6); 
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px; padding: 4px; 
        }
        .qty-btn { 
            background: #334155; border: none; color: white; 
            width: 28px; height: 28px; border-radius: 7px; 
            cursor: pointer; font-weight: bold; font-size: 0.9rem;
            display: flex; align-items: center; justify-content: center;
            transition: 0.2s;
        }
        .qty-btn:hover { background: #475569; }
        .qty-input { background: transparent; border: none; color: white; text-align: center; width: 35px; font-size: 0.95rem; font-weight: bold; }
        
        .add-to-cart-btn {
            flex: 1;
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: #38bdf8;
            padding: 9px 12px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
        }
        .add-to-cart-btn:hover {
            background: #38bdf8;
            color: #0b0f19;
        }
        .product-card.in-cart .add-to-cart-btn {
            background: #10b981;
            border-color: #10b981;
            color: white;
        }

        .load-more-container {
            text-align: center;
            margin-top: 40px;
        }
        .load-more-btn {
            background: #1e293b;
            border: 1px solid #334155;
            color: #cbd5e1;
            padding: 12px 35px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .load-more-btn:hover {
            background: #334155;
            color: white;
            border-color: #38bdf8;
        }

        footer {
            background: rgba(15, 23, 42, 0.95);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding: 25px 20px;
            text-align: center;
            font-size: 0.95rem;
            color: #94a3b8;
            margin-top: auto;
        }
        footer .developer-tag {
            color: #38bdf8;
            font-weight: 700;
            text-decoration: none;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        footer .developer-tag:hover {
            color: #6366f1;
            text-shadow: 0 0 10px rgba(99, 102, 241, 0.4);
        }

        .flying-item {
            position: fixed;
            z-index: 9999;
            object-fit: cover;
            border-radius: 50%;
            pointer-events: none;
            transition: all 0.8s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: 0 5px 15px rgba(56, 189, 248, 0.5);
        }

        .cart-summary-item {
            display: flex; justify-content: space-between; padding: 6px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06); font-size: 0.9rem; color: #e2e8f0;
        }
        .cart-summary-total {
            display: flex; justify-content: space-between; padding-top: 10px; margin-top: 4px;
            font-weight: 800; color: #38bdf8; font-size: 1rem;
        }
        #cart-summary { margin-bottom: 15px; background: rgba(15, 23, 42, 0.5); border-radius: 10px; padding: 10px 14px; max-height: 160px; overflow-y: auto; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(5px);
            display: flex; justify-content: center; align-items: center; z-index: 1000; opacity: 0; visibility: hidden; transition: 0.3s;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-content { background: #1e293b; border: 1px solid rgba(255, 255, 255, 0.1); width: 90%; max-width: 450px; padding: 30px; border-radius: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: #cbd5e1; font-size: 0.9rem; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 10px; color: white; outline: none; }
        .form-group select { cursor: pointer; }
        .error-hint { color: #f43f5e; font-size: 0.75rem; margin-top: 4px; display: none; }
        .submit-order-btn { width: 100%; background: linear-gradient(135deg, #10b981, #059669); border: none; padding: 14px; border-radius: 12px; color: white; font-weight: 700; cursor: pointer; margin-top: 10px; }
        .submit-order-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        
        .success-msg { text-align: center; display: none; }
        .success-msg i { font-size: 4rem; margin-bottom: 15px; }
        .success-msg.success i { color: #10b981; }
        .success-msg.error i { color: #f43f5e; }
        .success-msg.loading i { color: #38bdf8; animation: spin 1s linear infinite; }
        
        .modal-close-btn { background: none; border: none; color: #94a3b8; font-size: 1.2rem; cursor: pointer; }

</head>
<body>

    <header>
        <div class="logo"><i class="fa-solid fa-bag-shopping"></i> <span id="t-store-name">Samir Store</span></div>
        <div class="header-controls">
            <select class="lang-select" id="langSwitcher" onchange="changeLanguage(this.value)">
                <option value="ar">العربية</option>
                <option value="fr">Français</option>
                <option value="en">English</option>
            </select>
        </div>
    </header>

    <button class="floating-cart-btn" id="floatingCartBtn" onclick="openCartModal()">
        <i class="fa-solid fa-cart-shopping"></i>
        <div class="cart-badge" id="cart-count">0</div>
    </button>

    <main>
        <div class="hero-section">
            <h2 id="t-hero-title">اكتشف أحدث المنتجات والعروض</h2>
            <p id="t-hero-desc">اختر منتجاتك المفضلة وأضفها للسلة بكل سهولة</p>
        </div>

        <div class="products-grid" id="dynamic-products-container">
            <div class="loading-container" id="loadingSpinner">
                <div class="spinner"></div>
                <p id="t-loading" style="color: #94a3b8;">جاري تحميل المنتجات...</p>
            </div>
        </div>

        <div class="load-more-container" id="loadMoreContainer" style="display: none;">
            <button class="load-more-btn" onclick="loadMoreProducts()">
                <i class="fa-solid fa-rotate"></i> <span id="t-load-more">عرض المزيد من المنتجات</span>
            </button>
        </div>
    </main>

    <footer>
        <p>© 2026 Samir Store. All rights reserved. | Developed by <a href="#" class="developer-tag">@chikor</a></p>
    </footer>

    <div class="modal-overlay" id="orderModal">
        <div class="modal-content">
            <div id="order-form-container">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h3 id="t-modal-title" style="color: #fff;">تأكيد الطلب</h3>
                    <button type="button" onclick="closeModal()" class="modal-close-btn"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div id="cart-summary"></div>
                <form id="checkoutForm" onsubmit="submitOrderToTelegram(event)">
                    <div class="form-group">
                        <label id="t-name-label">الاسم واللقب:</label>
                        <input type="text" id="client-name" placeholder="أدخل اسمك الكامل..." required minlength="4">
                    </div>
                    <div class="form-group">
                        <label id="t-phone-label">رقم الهاتف:</label>
                        <input type="tel" id="client-phone" placeholder="05 / 06 / 07..." required>
                        <div class="error-hint" id="phone-error">رقم الهاتف يجب أن يكون 10 أرقام تبدأ بـ 05 أو 06 أو 07</div>
                    </div>
                    <div class="form-group">
                        <label id="t-wilaya-label">الولاية:</label>
                        <select id="client-wilaya" required onchange="updateCircles()">
                            <option value="">-- اختر الولاية --</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label id="t-daira-label">الدائرة / البلدية:</label>
                        <select id="client-daira" required>
                            <option value="">-- اختر الدائرة أولاً --</option>
                        </select>
                    </div>
                    <button type="submit" class="submit-order-btn" id="t-submit-btn">إرسال الطلب نهائياً</button>
                </form>
            </div>

            <div class="success-msg" id="successMsg">
                <i class="fa-solid fa-spinner"></i>
                <h3 id="t-success-title" style="color:#fff;">جاري معالجة طلبك...</h3>
                <p id="t-success-desc" style="color: #94a3b8; margin-bottom: 20px;">يرجى الانتظار...</p>
            </div>
        </div>
    </div>

        window.changeLanguage = function(lang) {
            const t = translations[lang];
            document.documentElement.lang = lang;
            document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';

            document.getElementById('t-store-name').innerText = t.storeName;
            document.getElementById('t-hero-title').innerText = t.heroTitle;
            document.getElementById('t-hero-desc').innerText = t.heroDesc;
            document.getElementById('t-modal-title').innerText = t.modalTitle;
            document.getElementById('t-name-label').innerText = t.nameLabel;
            document.getElementById('t-phone-label').innerText = t.phoneLabel;
            document.getElementById('t-wilaya-label').innerText = t.wilayaLabel;
            document.getElementById('t-daira-label').innerText = t.dairaLabel;
            document.getElementById('t-submit-btn').innerText = t.submitBtn;
            document.getElementById('phone-error').innerText = t.errorPhone;
            document.getElementById('t-load-more').innerText = t.loadMore;

            const loadingText = document.getElementById('t-loading');
            if (loadingText) loadingText.innerText = t.loading;

            loadWilayas();
            renderProducts();
        }

        window.loadWilayas = function() {
            const wilayaSelect = document.getElementById('client-wilaya');
            wilayaSelect.innerHTML = '<option value="">-- اختر الولاية --</option>';
            Object.keys(algerianWilayas).forEach(wilaya => {
                const option = document.createElement('option');
                option.value = wilaya;
                option.textContent = wilaya;
                wilayaSelect.appendChild(option);
            });
        }

        window.updateCircles = function() {
            const wilayaSelect = document.getElementById('client-wilaya');
            const dairaSelect = document.getElementById('client-daira');
            const selectedWilaya = wilayaSelect.value;
            dairaSelect.innerHTML = '<option value="">-- اختر الدائرة --</option>';
            if (selectedWilaya && algerianWilayas[selectedWilaya]) {
                algerianWilayas[selectedWilaya].forEach(daira => {
                    const option = document.createElement('option');
                    option.value = daira;
                    option.textContent = daira;
                    dairaSelect.appendChild(option);
                });
            }
        }

        async function loadProducts() {
            try {
                const querySnapshot = await getDocs(collection(db, "products"));
                productsData = [];
                querySnapshot.forEach((doc) => {
                    productsData.push({ id: doc.id, ...doc.data() });
                });
                loadWilayas();
                renderProducts();
            } catch (error) {
                console.error("Error loading products:", error);
                const container = document.getElementById('dynamic-products-container');
                container.innerHTML = '<p style="text-align: center; color: #f43f5e; grid-column: 1/-1;">خطأ في الاتصال بقاعدة البيانات.</p>';
            }
        }

        function renderProducts() {
            const container = document.getElementById('dynamic-products-container');
            const currentLang = document.getElementById('langSwitcher').value;
            const t = translations[currentLang];

            if (productsData.length === 0) {
                container.innerHTML = `<p style="text-align: center; color: #94a3b8; grid-column: 1/-1;">${t.noProducts}</p>`;
                document.getElementById('loadMoreContainer').style.display = 'none';
                return;
            }

            container.innerHTML = '';
            const sliceData = productsData.slice(0, visibleCount);

            sliceData.forEach((p) => {
                const card = document.createElement('div');
                card.className = `product-card ${cart[p.id] ? 'in-cart' : ''}`;
                card.dataset.productId = p.id;
                const currentQty = cart[p.id] ? cart[p.id].qty : 1;

                card.innerHTML = `
                    <div class="product-img-wrapper">
                        <img src="${p.image}" alt="${p.name}" class="product-img" onerror="this.src='https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=500&q=80'">
                    </div>
                    <div class="product-info">
                        <div class="product-title">${p.name}</div>
                        <div class="product-price">${p.price} DZD</div>
                    </div>
                    <div class="card-actions">
                        <div class="card-bottom-row">
                            <div class="quantity-control">
                                <button type="button" class="qty-btn" onclick="changeQty(this, -1)">-</button>
                                <input type="text" class="qty-input" value="${currentQty}" readonly>
                                <button type="button" class="qty-btn" onclick="changeQty(this, 1)">+</button>
                            </div>
                            <button type="button" class="add-to-cart-btn" onclick='toggleCartItem(event, this, ${JSON.stringify(p.id)}, ${JSON.stringify(p.name)}, ${p.price}, ${JSON.stringify(p.image)})'>
                                <i class="fa-solid fa-cart-plus"></i> <span>${cart[p.id] ? t.inCart : t.addToCart}</span>
                            </button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });

            const loadMoreBtnContainer = document.getElementById('loadMoreContainer');
            if (visibleCount < productsData.length) {
                loadMoreBtnContainer.style.display = 'block';
            } else {
                loadMoreBtnContainer.style.display = 'none';
            }
        }

        window.loadMoreProducts = function() {
            visibleCount += 6;
            renderProducts();
        }

        window.addEventListener('DOMContentLoaded', loadProducts);

        window.changeQty = function(button, delta) {
            const card = button.closest('.product-card');
            const productId = card.dataset.productId;
            const input = card.querySelector('.qty-input');
            let val = parseInt(input.value) + delta;
            if (val < 1) val = 1;
            input.value = val;
            if (cart[productId]) {
                cart[productId].qty = val;
                updateCartCount();
            }
        }

        window.toggleCartItem = function(event, button, id, name, price, image) {
            const card = button.closest('.product-card');
            const qty = parseInt(card.querySelector('.qty-input').value);
            const currentLang = document.getElementById('langSwitcher').value;
            const t = translations[currentLang];

            if (!cart[id]) {
                cart[id] = { name, price, qty, image };
                card.classList.add('in-cart');
                button.innerHTML = `<i class="fa-solid fa-check"></i> <span>${t.inCart}</span>`;
                triggerFlyToCart(event.target, image);
            } else {
                delete cart[id];
                card.classList.remove('in-cart');
                button.innerHTML = `<i class="fa-solid fa-cart-plus"></i> <span>${t.addToCart}</span>`;
            }
            updateCartCount();
        }

        function triggerFlyToCart(targetElement, imgSrc) {
            const cartBtn = document.getElementById('floatingCartBtn');
            const cartRect = cartBtn.getBoundingClientRect();
            const targetRect = targetElement.getBoundingClientRect();
            
            const flyer = document.createElement('img');
            flyer.src = imgSrc;
            flyer.className = 'flying-item';
            flyer.style.left = `${targetRect.left + targetRect.width / 2 - 25}px`;
            flyer.style.top = `${targetRect.top + targetRect.height / 2 - 25}px`;
            flyer.style.width = '50px';
            flyer.style.height = '50px';
            document.body.appendChild(flyer);

            setTimeout(() => {
                flyer.style.left = `${cartRect.left + cartRect.width / 2 - 10}px`;
                flyer.style.top = `${cartRect.top + cartRect.height / 2 - 10}px`;
                flyer.style.width = '20px';
                flyer.style.height = '20px';
                flyer.style.opacity = '0.3';
            }, 30);

            setTimeout(() => {
                flyer.remove();
                cartBtn.classList.add('shake');
                setTimeout(() => {
                    cartBtn.classList.remove('shake');
                }, 500);
            }, 800);
        }

        function updateCartCount() {
            const totalQty = Object.values(cart).reduce((sum, item) => sum + item.qty, 0);
            document.getElementById('cart-count').innerText = totalQty;
        }

        function renderCartSummary() {
            const container = document.getElementById('cart-summary');
            const currentLang = document.getElementById('langSwitcher').value;
            const t = translations[currentLang];
            const items = Object.values(cart);
            let total = 0;
            const rows = items.map(item => {
                const sub = item.price * item.qty;
                total += sub;
                return `<div class="cart-summary-item"><span>${item.name} × ${item.qty}</span><span>${sub} DZD</span></div>`;
            }).join('');
            container.innerHTML = rows + `<div class="cart-summary-total"><span>${t.cartTotal}</span><span>${total} DZD</span></div>`;
        }

        function resetCartUI() {
            cart = {};
            updateCartCount();
            document.querySelectorAll('.product-card').forEach(card => {
                card.classList.remove('in-cart');
                card.querySelector('.qty-input').value = 1;
                const currentLang = document.getElementById('langSwitcher').value;
                const t = translations[currentLang];
                card.querySelector('.add-to-cart-btn').innerHTML = `<i class="fa-solid fa-cart-plus"></i> <span>${t.addToCart}</span>`;
            });
        }

        window.openCartModal = function() {
            const currentLang = document.getElementById('langSwitcher').value;
            const t = translations[currentLang];

            if (Object.keys(cart).length === 0) {
                alert(t.emptyCart);
                return;
            }

            renderCartSummary();
            document.getElementById('order-form-container').style.display = 'block';
            document.getElementById('successMsg').style.display = 'none';
            document.getElementById('checkoutForm').reset();
            document.getElementById('client-wilaya').value = '';
            document.getElementById('client-daira').innerHTML = '<option value="">-- اختر الدائرة أولاً --</option>';
            document.getElementById('orderModal').classList.add('active');
        }

        window.closeModal = function() {
            document.getElementById('orderModal').classList.remove('active');
        }

        // إرسال الطلب كتابياً بشكل فائق السرعة دون صور
        window.submitOrderToTelegram = async function(event) {
            event.preventDefault();
            
            const name = document.getElementById('client-name').value.trim();
            const phone = document.getElementById('client-phone').value.trim();
            const wilaya = document.getElementById('client-wilaya').value;
            const daira = document.getElementById('client-daira').value;

            if (!/^(05|06|07)[0-9]{8}$/.test(phone)) {
                document.getElementById('phone-error').style.display = 'block';
                return;
            }
            document.getElementById('phone-error').style.display = 'none';

            document.getElementById('order-form-container').style.display = 'none';
            const successMsg = document.getElementById('successMsg');
            successMsg.style.display = 'block';
            successMsg.className = 'success-msg loading';
            
            const currentLang = document.getElementById('langSwitcher'].value;
            const t = translations[currentLang];
            
            document.getElementById('t-success-title').innerText = t.processingTitle;
            document.getElementById('t-success-desc').innerText = t.processingDesc;

            const items = Object.values(cart);
            let total = 0;
            const itemsText = items.map(item => {
                const sub = item.price * item.qty;
                total += sub;
                return `• ${item.name} (الكمية: ${item.qty}) = ${sub} DZD`;
            }).join('\n');

            const message = `🚨 *طلب جديد من متجر Samir Store!*\n\n` +
                            `🛍️ *المنتجات:*\n${itemsText}\n\n` +
                            `💰 *الإجمالي الكلي:* ${total} DZD\n\n` +
                            `👤 *الاسم:* ${name}\n` +
                            `📞 *الهاتف:* ${phone}\n` +
                            `📍 *الولاية:* ${wilaya}\n` +
                            `📍 *الدائرة:* ${daira}`;

            const BOT_TOKEN = "8701140722:AAEMw7BCjIcoHaDGEUCX-fFNOiZOIJQTYzQ";
            const CHAT_IDS = ["573315219880", "1:573315219880:web:ae5a4ef4e77789a2d81d9d"]; 
            
            try {
                // استخدام sendMessage النصية الخفيفة والفورية بدلاً من إرسال الصور
                const promises = CHAT_IDS.map(chatId => 
                    fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            chat_id: chatId,
                            text: message,
                            parse_mode: 'Markdown'
                        })
                    }).then(res => res.json())
                );

                const results = await Promise.all(promises);
                const allSuccess = results.every(r => r.ok);

                setTimeout(() => {
                    if (allSuccess) {
                        successMsg.className = 'success-msg success';
                        document.getElementById('t-success-title').innerText = t.successTitle;
                        document.getElementById('t-success-desc').innerText = t.successDesc;
                        document.querySelector('#successMsg i').innerHTML = '<i class="fa-solid fa-circle-check"></i>';

                        resetCartUI();

                        const closeBtn = document.createElement('button');
                        closeBtn.type = 'button';
                        closeBtn.className = 'submit-order-btn';
                        closeBtn.style.marginTop = '20px';
                        closeBtn.textContent = 'حسناً';
                        closeBtn.onclick = closeModal;
                        
                        const oldBtn = document.querySelector('#successMsg .submit-order-btn');
                        if (oldBtn) oldBtn.remove();
                        document.getElementById('successMsg').appendChild(closeBtn);
                    } else {
                        throw new Error("One or more messages failed");
                    }
                }, 800);

            } catch (err) {
                console.error(err);
                setTimeout(() => {
                    successMsg.className = 'success-msg error';
                    document.getElementById('t-success-title').innerText = t.errorTitle;
                    document.getElementById('t-success-desc').innerText = t.errorDesc;
                    document.querySelector('#successMsg i').innerHTML = '<i class="fa-solid fa-circle-xmark"></i>';
                    
                    const retryBtn = document.createElement('button');
                    retryBtn.type = 'button';
                    retryBtn.className = 'submit-order-btn';
                    retryBtn.style.marginTop = '20px';
                    retryBtn.textContent = 'محاولة أخرى';
                    retryBtn.onclick = () => {
                        document.getElementById('order-form-container').style.display = 'block';
                        document.getElementById('successMsg').style.display = 'none';
                    };
                    
                    const oldBtn = document.querySelector('#successMsg .submit-order-btn');
                    if (oldBtn) oldBtn.remove();
                    document.getElementById('successMsg').appendChild(retryBtn);
                }, 1000);
            }
        }
    </script>
